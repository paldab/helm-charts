common:
  global:
    nameOverride: immich-public-proxy

  serviceAccount:
    immich-public-proxy:
      enabled: true

  controllers:
    main:
      replicas: 1

      serviceAccount:
        identifier: immich-public-proxy

      containers:
        immich-public-proxy:
          image:
            repository: alangrainger/immich-public-proxy
            tag: "latest"
            pullPolicy: IfNotPresent

          resources:
            requests:
              cpu: 10m
              memory: 10Mi

          env:
            PUBLIC_BASE_URL: http://share.example.com
            IMMICH_URL: http://immich-server.default.svc.cluster.local:2283

          probes:
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /share/healthcheck
                  port: 3000
                initialDelaySeconds: 10
                timeoutSeconds: 5
 
  service:
    main:
      controller: main
      ports:
        http:
          port: 3000

  ingress:
    main:
      className: nginx
      hosts:
        - host: share.example.com
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - secretName: immich-proxy-tls
          hosts:
            - share.example.com

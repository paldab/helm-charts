common:
  serviceAccount:
    home-docs:
      enabled: true

  controllers:
    main:
      replicas: 1
      strategy: RollingUpdate

      serviceAccount:
        identifier: home-docs

      containers:
        docs:
          image:
            repository: paer12/home-docs
            tag: "0.1.1"

  service:
    main:
      controller: main
      ports:
        http:
          port: 80

  ingress:
    main:
      className: nginx
      hosts:
        - host: docs.example.com
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - secretName: docs-tls
          hosts:
            - docs.example.com
